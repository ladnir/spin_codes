<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Where encoding sits in a prover</title><desc id="desc">The witness enters an encoding and hashing pipeline. Computation checks produce claims, and the PCS provides authenticated openings.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#CD461A"/></marker></defs><rect width="1100" height="480" fill="#FAF9F6"/>
<text x="42" y="53" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#202326" text-anchor="start">Where the prover spends work</text>
<text x="42" y="86" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#5E656B" text-anchor="start">Conceptual roles in a code-based proof system</text>
<rect x="292" y="128" width="755" height="172" rx="8" fill="none" stroke="#D7D8D4" stroke-width="1.5"/>
<text x="316" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#5E656B" text-anchor="start">COMMITMENT LAYER</text>
<text x="123" y="218" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202326" text-anchor="middle">Large witness</text>
<text x="123" y="250.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202326" text-anchor="middle">table</text>
<line x1="224" y1="222" x2="314" y2="222" stroke="#CD461A" stroke-width="2" marker-end="url(#arrow)" />
<rect x="331" y="181" width="180" height="82" rx="5" fill="#FADED1" stroke="#CD461A" stroke-width="1.5"/>
<text x="421" y="216" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#CD461A" text-anchor="middle">Encode</text>
<text x="421" y="245" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#CD461A" text-anchor="middle">touch every row</text>
<line x1="521" y1="222" x2="598" y2="222" stroke="#CD461A" stroke-width="2" marker-end="url(#arrow)" />
<text x="697" y="212" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202326" text-anchor="middle">Hash encoded</text>
<text x="697" y="244.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#202326" text-anchor="middle">columns</text>
<line x1="792" y1="222" x2="868" y2="222" stroke="#CD461A" stroke-width="2" marker-end="url(#arrow)" />
<text x="953" y="231" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#202326" text-anchor="middle">Commitment</text>
<text x="168" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202326" text-anchor="middle">Computation checks</text>
<text x="168" y="411.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202326" text-anchor="middle">reduce correctness to claims</text>
<line x1="365" y1="384" x2="486" y2="384" stroke="#CD461A" stroke-width="2" marker-end="url(#arrow)" />
<text x="664" y="372" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202326" text-anchor="middle">Claims about the witness</text>
<text x="664" y="401.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#202326" text-anchor="middle">answered by the PCS</text>
<line x1="859" y1="384" x2="935" y2="384" stroke="#CD461A" stroke-width="2" marker-end="url(#arrow)" />
<text x="1000" y="374" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202326" text-anchor="middle">Sample +</text>
<text x="1000" y="399.65" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#202326" text-anchor="middle">authenticate</text>
<text x="43" y="449" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#CD461A" text-anchor="start">Fast algebraic checks still need an efficient commitment layer.</text></svg>