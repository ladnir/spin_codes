name: Packed MSVC diagnosis
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Extract and compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $mode = '${{ matrix.mode }}'
          if ($mode -eq 'runtime') { python spin/tools/probe_packed.py out/probe.cpp --runtime-tables }
          else { python spin/tools/probe_packed.py out/probe.cpp }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opt = if ($mode -eq 'debug') { '/Od' } else { '/O2' }
          cl /nologo /std:c++20 /EHsc /arch:AVX2 $opt /Ispin/src out/probe.cpp /Fo:out/probe.obj /Fe:out/probe.exe /link /MAP:out/probe.map
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probe
        run: ./out/probe.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-probe-${{ matrix.mode }}
          path: |
            out/probe.cpp
            out/probe.exe
            out/probe.map
