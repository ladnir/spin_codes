name: Paper artifact source checks

on:
  push:
  pull_request:

jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Generated IMT evidence is released separately, not committed to Git.
      # These tests do not claim certificate or numerical-replay verification.
      - name: Artifact packaging and missing-evidence rejection tests
        run: python -B -m unittest discover -s artifact -p "test_*.py"
      - name: Exact-union adapter tests
        run: python -B -m unittest discover -s paper -p "test_imt_results.py"
      - name: Manuscript terminology tests
        run: python -B -m unittest discover -s paper -p "test_imt_narrative.py"
