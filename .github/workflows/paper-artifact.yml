name: Paper artifact quick checks

on:
  push:
  pull_request:

jobs:
  quick:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B artifact/reproduce.py quick
      - run: python -B -m unittest discover -s artifact -p "test_*.py"
